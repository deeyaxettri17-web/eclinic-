{% load clinic_tags %}
<div class="card card-hover h-100">
  <div class="card-body p-4 d-flex flex-column">
    <div class="d-flex align-items-center gap-3 mb-3">
      {% if doctor.photo %}
        <img src="{{ doctor.photo.url }}" alt="" class="avatar">
      {% else %}
        <span class="avatar">{{ doctor.user|initials }}</span>
      {% endif %}
      <div>
        <h3 class="h6 fw-bold mb-0">{{ doctor }}</h3>
        <div class="small text-primary fw-semibold"><i class="bi bi-{{ doctor.specialization.icon|default:'hospital' }} me-1"></i>{{ doctor.specialization|default:"General" }}</div>
      </div>
    </div>
    <p class="small text-muted mb-2">{{ doctor.qualification }}</p>
    <div class="d-flex gap-3 small text-muted mb-3">
      <span><i class="bi bi-award me-1"></i>{{ doctor.experience_years }} yrs exp.</span>
      <span><i class="bi bi-cash me-1"></i>Rs. {{ doctor.consultation_fee|floatformat:0 }}</span>
    </div>
    <div class="mt-auto d-flex gap-2">
      <a href="{{ doctor.get_absolute_url }}" class="btn btn-outline-primary btn-sm flex-fill">Profile</a>
      <a href="{% url 'book_appointment' doctor.pk %}" class="btn btn-primary btn-sm flex-fill">Book now</a>
    </div>
  </div>
</div>
